name: Sync GitHub Achievements

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install GitHub Achievements CLI
        run: gh extension install nmloc/gh-achievements

      - name: Fetch official achievement data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh achievements rayyan-anwar --json > achievements.json

      - name: Update README
        run: python .github/scripts/sync_achievements.py

      - name: Commit changes
        run: |
          rm -f achievements.json
          if git diff --quiet; then
            echo "No achievement changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GitHub achievements"
          git push
